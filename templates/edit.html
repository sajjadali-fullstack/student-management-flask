<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Page</title>
    <!-- Internal CSS -->
     <style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        background: cornflowerblue;
        text-align: center;
        margin: 0;
        padding: 0;
    }

    h1 {
        margin-top: 30px;
        color: #fff;
    }

    form {
        width: 40%;
        margin: 30px auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px #150101;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        padding: 10px 20px;
        background: #2980b9;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 95%;
    }

    button:hover {
        background: #1f6391;
    }
</style>
     
</head>
<body>
    <h1>Edit Student</h1>

<form method="POST">
    <input type="text" name="name" value="{{ student.name }}">
    <input type="number" name="age" value="{{ student.age }}">
    <input type="text" name="course" value="{{ student.course }}">
    <button type="submit">Update</button>
</form>
</body>
</html>
